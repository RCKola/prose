[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prose"
version = "0.1.0"
description = "PROSE: Training-free egocentric scene registration with vision-language models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "PROSE authors" }]

dependencies = [
    # Hydra config
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",

    # Core scientific
    "numpy>=1.24,<2.3",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "easydict>=1.10",

    # Image / video I/O
    "opencv-python>=4.8",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
    "Pillow>=10.0",

    # 3D
    "plyfile>=1.0",
    "trimesh>=4.0",

    # Foundation models.
    # torch / torchvision are installed separately to match your CUDA build.
    # SAM3 video (Sam3VideoModel / Sam3VideoProcessor) needs transformers>=5.0.
    "transformers>=5.0",
    "accelerate>=1.1",
    "huggingface_hub>=1.3,<2.0",
    "tokenizers>=0.22,<=0.23",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "qwen-vl-utils>=0.0.8",

    # .env loader
    "python-dotenv>=1.0",

    # RANSAC: pygcransac is preferred but optional. When unavailable, the
    # registration stage falls back to a plain Umeyama (SVD) fit.
    #     pip install pygcransac
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ipykernel", "matplotlib>=3.7"]
# Visualization / FPFH descriptor (Open3D, Python <= 3.12).
viz = ["open3d>=0.18"]
# Faster object-listing / correspondence VLM inference (Qwen3.6 via vLLM).
vllm = ["vllm>=0.6"]
# pygcransac RANSAC backend.
ransac = ["pygcransac>=0.0.1"]

[project.scripts]
prose = "prose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["prose*"]
